<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Chat</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- PeerJS-Bibliothek für Audio- und Sprachkanäle -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Screen: Server wacht auf -->
  <div id="wakingUp" class="hidden">
    <div class="auth-card" style="text-align:center;">
      <h1>Nexus</h1>
      <p class="sub" id="wakingText">Server wacht auf, das kann bis zu einer Minute dauern…</p>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Screen: Login / Registrierung -->
  <div id="auth" class="hidden">
    <div class="auth-card">
      <h1>Nexus</h1>
      <p class="sub">Der erste registrierte Account wird automatisch dein <strong>Owner-Konto</strong>.</p>
      <input id="loginUser" placeholder="Benutzername" autocomplete="username" />
      <input id="loginPass" type="password" placeholder="Passwort" autocomplete="current-password" />
      <div class="auth-actions">
        <button id="login">Anmelden</button>
        <button id="register" class="ghost">Konto erstellen</button>
      </div>
      <p id="authMsg" class="auth-msg"></p>
    </div>
  </div>

  <!-- Screen: Hauptanwendung -->
  <div id="app" class="hidden">
    <!-- Server-Leiste -->
    <div id="servers"></div>

    <!-- Kanäle-Leiste -->
    <div id="channelsPane">
      <div id="serverHeader">
        <span id="serverName"></span>
      </div>

      <!-- Kanalliste (Text & Voice) -->
      <div id="channels"></div>

      <!-- Control-Bar für aktive Sprachverbindung -->
      <div id="voiceControl" class="hidden" style="padding:10px; background:#111; color:#fff; display:flex; justify-content:space-between; align-items:center;">
        <span id="voiceStatus">Verbunden im Sprachkanal</span>
        <button id="leaveVoiceBtn" style="background:#e74c3c; border:none; padding:5px 10px; color:#fff; cursor:pointer; border-radius:4px;">Auflegen</button>
      </div>

      <div id="ownerPanelToggle" class="hidden">⚙ Owner-Panel</div>
      
      <!-- Profil-Panel unten links -->
      <div id="mePanel">
        <img id="meAvatar" />
        <div class="me-info">
          <div id="meName"></div>
          <div id="meTag" class="me-tag"></div>
        </div>
      </div>
    </div>

    <!-- Hauptfenster für Chatnachrichten -->
    <div id="main">
      <div id="connBanner" class="hidden"></div>
      <div id="mainHeader">
        <span class="hash">#</span><span id="channelName"></span>
        <span id="typing"></span>
      </div>
      <div id="messages"></div>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="Nachricht schreiben..." />
        <button type="submit">Senden</button>
      </form>
    </div>

    <!-- Mitglieder-Leiste rechts -->
    <div id="membersPane"></div>
  </div>

  <!-- Modal: Owner-Panel -->
  <div id="ownerModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Owner-Panel</h2>
        <button id="closeOwnerModal" class="ghost">Schließen</button>
      </div>
      <p class="sub">Nutzer verifizieren oder aus einem Server entfernen.</p>
      <div id="ownerUserList"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
